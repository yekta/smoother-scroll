name: Build

# Tests and builds the app on pull requests that change it. Main is built and published by
# release.yml.
on:
  pull_request:
    paths:
      - Sources/**
      - Tests/**
      - Resources/**
      - Package.swift
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build the app
        run: scripts/build-app.sh

      - name: Zip the app
        run: ditto -c -k --keepParent "build/Smoother Scroll.app" SmootherScroll.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SmootherScroll
          path: SmootherScroll.zip
          retention-days: 7
